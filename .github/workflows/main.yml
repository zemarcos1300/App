name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar o projeto Android
        id: find
        run: |
          SETTINGS=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Nenhum settings.gradle.kts encontrado no repositório. Envie TODOS os arquivos do projeto (incluindo a pasta app/)."
            echo "Arquivos presentes no repositório:"
            find . -type f -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projeto encontrado em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ ! -f "$DIR/app/build.gradle.kts" ] || [ ! -f "$DIR/app/src/main/java/com/veil/launcher/MainActivity.kt" ]; then
            echo "::error::Faltam arquivos do módulo app/ em $DIR. Verifique se a pasta app/ foi enviada por completo."
            find "$DIR" -type f | head -50
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Build debug APK
        run: gradle -p "${{ steps.find.outputs.dir }}" :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VEIL-Launcher-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
